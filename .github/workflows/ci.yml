name: CI

on:
  pull_request:
  push:
    branches: [main]
    # A release tag, such as v1.2.3. The publish job pushes the image once every other job passes,
    # then the release job makes the GitHub release. A pre-release tag, such as v1.2.0-rc1, runs
    # every check but skips the benchmarks, publish, and release jobs, so the run is green and
    # nothing is pushed. docs/releasing.md has the steps.
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      # better-sqlite3 has no install script: its npm tarball, which the lockfile pins, holds a
      # module built for each platform, and the tests load the one for this runner. Nothing is
      # downloaded. The Docker image compiles its own from the tarball's source instead.
      - run: pnpm install --frozen-lockfile
      - name: Biome
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Vitest
        run: pnpm test
      - name: Build
        run: pnpm build

  licenses:
    name: License check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: License check
        run: pnpm check:licenses

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: pnpm audit --prod --audit-level high
        run: pnpm check:audit

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/gitleaks.tar.gz" --directory "$RUNNER_TEMP" gitleaks
      # Runs the same scan on random fake values in a throwaway repo, and checks that each
      # rule that matters still catches its value.
      - name: The scan catches a planted fake value for each kind of secret
        run: scripts/secret-scan-canary.sh "$RUNNER_TEMP/gitleaks"
      - name: Scan every commit, and the files as they stand, for secrets
        run: scripts/secret-scan.sh "$RUNNER_TEMP/gitleaks" .

  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build --tag family-finance-tracker:ci .
      - name: GET /healthz answers 200, and / serves the web app
        run: |
          # curl --fail then fails the step on a status that is not 2xx, not only grep.
          set -o pipefail
          # A throwaway Master key, made for this run, in the file the app reads by default. It is
          # mounted read-only, as a platform's secret file is, so the entrypoint cannot give it to
          # the app's user. That user must then be able to read it.
          openssl rand -hex 32 > "$RUNNER_TEMP/master.key"
          chmod 644 "$RUNNER_TEMP/master.key"
          docker run --detach --name app --env PORT=8080 --env APP_URL=http://127.0.0.1:8080 \
            --mount "type=bind,source=$RUNNER_TEMP/master.key,target=/run/secrets/master.key,readonly" \
            --publish 8080:8080 family-finance-tracker:ci
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/healthz; then break; fi
            sleep 1
          done
          if ! curl --fail --silent --show-error http://127.0.0.1:8080/healthz; then
            docker logs app
            exit 1
          fi
          # The web app answers / and any page path that is not a file.
          for path in / /no/such/page; do
            curl --fail --silent --show-error --output /dev/null --write-out '%{content_type}\n' \
              "http://127.0.0.1:8080$path" | grep '^text/html'
          done
      - name: The image has the fft command
        run: |
          # It prints a throwaway Master key, which only grep reads.
          docker run --rm family-finance-tracker:ci fft setup --app-url https://money.example.com \
            | grep --quiet '^  https://money.example.com/setup#code='
      - name: No path under /app is group- or world-writable
        run: |
          # Symbolic links always show every permission, so find skips them.
          writable=$(docker run --rm --entrypoint find family-finance-tracker:ci /app ! -type l -perm /go=w)
          if [ -n "$writable" ]; then
            echo "$writable" | head -20
            exit 1
          fi
      - name: The image holds no native build leftovers
        run: |
          # better-sqlite3's deps and src folders hold the source it compiles from. Its prebuilds
          # folder holds the npm tarball's modules, which the image replaces with its own build.
          leftovers=$(docker run --rm --entrypoint find family-finance-tracker:ci /app/node_modules \
            \( -name '*.a' -o -name '*.o' -o -name test_extension.node \
            -o -path '*/better-sqlite3/deps' -o -path '*/better-sqlite3/src' \
            -o -path '*/better-sqlite3/prebuilds' \) -print)
          if [ -n "$leftovers" ]; then
            echo "$leftovers" | head -20
            exit 1
          fi
      - name: The image holds its notices, and the app serves the browser's
        run: |
          set -o pipefail
          docker run --rm --entrypoint grep family-finance-tracker:ci --quiet '^hono ' dist/THIRD-PARTY-NOTICES.txt
          curl --fail --silent --show-error --output notices.txt --write-out '%{content_type}\n' \
            http://127.0.0.1:8080/third-party-notices.txt | grep '^text/plain'
          grep --quiet '^react ' notices.txt
      - name: compose.yaml starts the app as UID 1000, and PUID and PGID change it
        run: scripts/compose-smoke-test.sh family-finance-tracker:ci
      # The README's quick start, word for word, with APP_URL=http://localhost:3000. It fetches
      # nothing: compose.yaml and .env.example come from this checkout. Then the first-run wizard
      # with the Banks step skipped, and the restore drill. No bank is connected. The link check
      # on the README and docs/self-hosting.md runs with the tests, in scripts/doc-links.test.ts.
      - name: The README quick start reaches the dashboard, and a backup restores, on amd64
        run: scripts/quick-start-test.sh family-finance-tracker:ci

  platforms:
    name: Docker image for amd64 and arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
          cache-image: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
      # The arm64 build runs under QEMU and compiles better-sqlite3, so it is slow. The GitHub
      # Actions cache keeps its layers. A pull request's cache is its own; main never reads it.
      - name: Build for both platforms, with no push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The arm64 image alone, loaded into Docker. The step above left its layers in the builder.
      - name: Load the arm64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: family-finance-tracker:arm64
      # The same quick start, wizard, and restore drill as on amd64, under QEMU.
      - name: The README quick start reaches the dashboard, and a backup restores, on arm64
        run: scripts/quick-start-test.sh family-finance-tracker:arm64 linux/arm64

  benchmarks:
    name: Release Benchmark snapshot check
    # The release's own check, with the publish job's condition. It fails while the Benchmark
    # snapshot is the sample built from the made-up fixture files, so a release can never ship
    # sample numbers. Pushes and pull requests do not run it. It runs the packages' code, so it is
    # its own job with a read-only token, and the publish job, which can push images, runs none.
    if: >-
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') &&
      !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A release builds from scratch, so the install reads no cache that another run wrote.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: pnpm install --frozen-lockfile
      - name: The Benchmark snapshot was built from the real source files
        run: pnpm check:benchmarks

  publish:
    name: Publish the image
    # Only a v* tag publishes, and only after every other job passes on the tagged commit,
    # benchmarks included. A pre-release tag, such as v1.2.0-rc1, has a "-", so it skips this job,
    # the benchmarks job, and the release job: the run is green, and no image or release is made.
    if: >-
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') &&
      !contains(github.ref_name, '-')
    needs: [check, licenses, audit, secrets, image, platforms, benchmarks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The three image names
        id: names
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Only a release tag, such as v1.2.3, publishes. A pre-release must never become latest.
          if ! [[ "$TAG" =~ ^v(([0-9]+)\.[0-9]+\.[0-9]+)$ ]]; then
            echo "$TAG is not a release tag, such as v1.2.3." >&2
            exit 1
          fi
          version=${BASH_REMATCH[1]}
          major=${BASH_REMATCH[2]}
          # The app shows package.json's version in Settings, About, and the release job reads
          # the tag's release notes, so both must match the tag before anything is pushed.
          if [ "$(jq --raw-output .version package.json)" != "$version" ]; then
            echo "package.json's version is not $version." >&2
            exit 1
          fi
          if ! [ -f "docs/release-notes/$TAG.md" ]; then
            echo "docs/release-notes/$TAG.md is missing." >&2
            exit 1
          fi
          image=ghcr.io/therecluse26/family-finance-tracker
          {
            echo "version=$version"
            echo "tags<<EOF"
            echo "$image:$version"
            echo "$image:$major"
            echo "$image:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
          cache-image: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
      - name: Sign in to GitHub's container registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
      # A release builds from scratch, so it reads no cache that another run wrote.
      - name: Build for both platforms, and push the three names
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          no-cache: true
          pull: true
          tags: ${{ steps.names.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ steps.names.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Sign out of the registry
        if: always()
        run: docker logout ghcr.io

  release:
    name: GitHub release
    # Only after the image push succeeds. A skipped publish job, as for a pre-release tag, skips
    # this one too. Its own job, so only this short step holds a token that can write to the repo.
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The workflow's own token makes the release, from the tag's notes in docs/release-notes/.
      - name: Make the GitHub release from its release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # The publish job checks the tag too. This job checks it again, so it stays safe if its
          # needs change.
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "$TAG is not a release tag, such as v1.2.3." >&2
            exit 1
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" \
            --notes-file "docs/release-notes/$TAG.md"
