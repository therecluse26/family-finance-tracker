name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      # better-sqlite3 compiles from its npm tarball, which the lockfile pins, against this Node's
      # own headers. Its install script then downloads no binary and no headers.
      - name: Build native modules from source
        run: |
          echo "npm_config_build_from_source=true" >> "$GITHUB_ENV"
          echo "npm_config_nodedir=$(dirname "$(dirname "$(command -v node)")")" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - name: Biome
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Vitest
        run: pnpm test
      - name: Build
        run: pnpm build

  licenses:
    name: License check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      # better-sqlite3 compiles from its npm tarball, which the lockfile pins, against this Node's
      # own headers. Its install script then downloads no binary and no headers.
      - name: Build native modules from source
        run: |
          echo "npm_config_build_from_source=true" >> "$GITHUB_ENV"
          echo "npm_config_nodedir=$(dirname "$(dirname "$(command -v node)")")" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - name: License check
        run: pnpm check:licenses

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: pnpm audit --prod --audit-level high
        run: pnpm check:audit

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/gitleaks.tar.gz" --directory "$RUNNER_TEMP" gitleaks
      # Runs the same scan on random fake values in a throwaway repo, and checks that each
      # rule that matters still catches its value.
      - name: The scan catches a planted fake value for each kind of secret
        run: scripts/secret-scan-canary.sh "$RUNNER_TEMP/gitleaks"
      - name: Scan every commit, and the files as they stand, for secrets
        run: scripts/secret-scan.sh "$RUNNER_TEMP/gitleaks" .

  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build --tag family-finance-tracker:ci .
      - name: GET /healthz answers 200
        run: |
          # A throwaway Master key, made for this run, in the file the app reads by default. The
          # app runs as the image's node user, so that user must be able to read it.
          openssl rand -hex 32 > "$RUNNER_TEMP/master.key"
          chmod 644 "$RUNNER_TEMP/master.key"
          docker run --detach --name app --env PORT=8080 --env APP_URL=http://127.0.0.1:8080 \
            --mount "type=bind,source=$RUNNER_TEMP/master.key,target=/run/secrets/master.key,readonly" \
            --publish 8080:8080 family-finance-tracker:ci
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/healthz; then exit 0; fi
            sleep 1
          done
          docker logs app
          exit 1
      - name: The image has the fft command
        run: |
          # It prints a throwaway Master key, which only grep reads.
          docker run --rm family-finance-tracker:ci fft setup --app-url https://money.example.com \
            | grep --quiet '^  https://money.example.com/setup#code='
      - name: No path under /app is group- or world-writable
        run: |
          # Symbolic links always show every permission, so find skips them.
          writable=$(docker run --rm --entrypoint find family-finance-tracker:ci /app ! -type l -perm /go=w)
          if [ -n "$writable" ]; then
            echo "$writable" | head -20
            exit 1
          fi
      - name: The image holds its notices, and the app serves the browser's
        run: |
          docker run --rm --entrypoint grep family-finance-tracker:ci --quiet '^hono ' dist/THIRD-PARTY-NOTICES.txt
          curl --fail --silent --show-error --output notices.txt --write-out '%{content_type}\n' \
            http://127.0.0.1:8080/third-party-notices.txt | grep '^text/plain'
          grep --quiet '^react ' notices.txt
